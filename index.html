<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM-1 Chop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9c6bd">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--body:#c9c6bd;--ink:#23221f;--lcd:#a8bba4;--lcdink:#1d2b21;--pad:#2a2a2c;--lit:#e8532b;--key:#e6e3da;--edge:#8e8b82;--ok:#2f6b3b;--bad:#b3321a;
--ui:"Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--body);color:var(--ink);font:15px/1.35 var(--ui)}
body{max-width:640px;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:4px 0 12px}
section{margin-bottom:14px}
.lcd{background:var(--lcd);color:var(--lcdink);border:2px solid #6f7c6c;border-radius:6px;padding:8px;box-shadow:inset 0 0 0 1px #c3d2c0}
.lcd .bar{display:flex;justify-content:space-between;font:12px var(--mono);margin-bottom:6px}
canvas{display:block;width:100%;height:150px;touch-action:none;background:var(--lcd)}
.meter{height:6px;background:#8ea08b;margin-top:6px}.meter i{display:block;height:100%;width:0;background:var(--lcdink)}.meter.over i{background:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--key);border:1px solid var(--edge);border-radius:5px;padding:9px 12px;min-height:40px}
button:disabled{opacity:.45}
button.go{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,.pad:focus-visible{outline:3px solid var(--lit);outline-offset:1px}
select,input[type=text]{background:var(--key);border:1px solid var(--edge);border-radius:5px;padding:8px;min-height:40px}
input[type=range]{flex:1;min-width:90px}
label{display:flex;gap:6px;align-items:center}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad{aspect-ratio:1;background:var(--pad);color:#d8d6cf;border:0;border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:8px;text-align:left;touch-action:manipulation}
.pad b{font-size:18px}.pad small{font:11px var(--mono);opacity:.8}.pad.empty{opacity:.35}
.pad.lit{background:var(--lit);color:#fff;transition:none}
.pad{transition:background .25s}
.panel{background:#d9d6cd;border:1px solid var(--edge);border-radius:6px;padding:10px}
.panel h2{font-size:15px;margin:0 0 6px}
.f{display:flex;flex-wrap:wrap;gap:8px 12px}
#msg{font:13px var(--mono);margin-top:8px;white-space:pre-wrap;min-height:1.4em}#msg.err{color:var(--bad)}#msg.ok{color:var(--ok)}
@media (prefers-reduced-motion:reduce){.pad{transition:none}}
</style>
</head>
<body>
<div class="row" style="justify-content:space-between;margin:0"><h1>FM-1 Chop</h1><button id="install" type="button" hidden>Install app</button></div>

<section class="lcd">
  <div class="bar"><span id="fname">no sample loaded</span><span id="cap">0.0 / 7.4 s</span></div>
  <canvas id="wv" aria-label="Waveform. Tap to place the cursor, drag a marker to move it."></canvas>
  <div class="meter" id="meter"><i></i></div>
</section>

<section>
  <div class="row">
    <label class="go"><button id="open" class="go" type="button">Load audio</button></label>
    <input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.flac" hidden>
    <button id="add" type="button" disabled>Add marker</button>
    <button id="del" type="button" disabled>Remove marker</button>
    <button id="undo" type="button" disabled>Undo</button>
  </div>
  <div class="row">
    <select id="eqn" aria-label="Number of equal slices"><option>4</option><option>8</option><option>12</option><option selected>16</option></select>
    <button id="eq" type="button" disabled>Equal slices</button>
    <button id="auto" type="button" disabled>Auto chop</button>
    <label>Sensitivity <input id="sens" type="range" min="1.2" max="4" step="0.1" value="2.2"></label>
  </div>
  <div class="row">
    <button id="zo" type="button" disabled>Zoom out</button>
    <button id="zi" type="button" disabled>Zoom in</button>
    <input id="scroll" type="range" min="0" max="1000" value="0" aria-label="Scroll waveform" disabled>
    <label><input id="fade" type="checkbox" checked> Fade chop ends</label>
  </div>
</section>

<section>
  <div class="pads" id="pads"></div>
</section>

<section class="panel">
  <h2>Send to FM-1</h2>
  <div class="f">
    <label>Slot <select id="slot"><option value="1">USR1</option><option value="2">USR2</option><option value="3">USR3</option></select></label>
    <label>Name <input id="name" type="text" maxlength="8" value="CHOP" size="8" autocapitalize="characters"></label>
    <label>First pad <select id="base"><option value="36">C2</option><option value="48">C3</option><option value="60" selected>C4</option><option value="72">C5</option></select></label>
    <label>Pad keys <select id="lay"><option value="chro">Chromatic</option><option value="white">White keys</option></select></label>
  </div>
  <div class="row">
    <button id="conn" type="button">Connect</button>
    <select id="port" hidden aria-label="MIDI port"></select>
    <button id="info" type="button" disabled>Read slots</button>
    <button id="send" type="button" class="go" disabled>Upload to slot</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</section>

<script>
const RATE = 22050, MAXB = 0x14000 - 512, MAXZ = 16, MIN = 64;

/*CORE*/
const STEP = [7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];
const IDXA = [-1,-1,-1,-1,2,4,6,8];
function imaEncode(s) {
  let pred = 0, idx = 0;
  const out = new Uint8Array((s.length + 1) >> 1);
  for (let n = 0; n < s.length; n++) {
    const step = STEP[idx];
    let diff = s[n] - pred, code = 0;
    if (diff < 0) { code = 8; diff = -diff; }
    let vd = step >> 3;
    if (diff >= step) { code |= 4; diff -= step; vd += step; }
    if (diff >= (step >> 1)) { code |= 2; diff -= step >> 1; vd += step >> 1; }
    if (diff >= (step >> 2)) { code |= 1; vd += step >> 2; }
    pred = (code & 8) ? pred - vd : pred + vd;
    if (pred > 32767) pred = 32767; else if (pred < -32768) pred = -32768;
    idx += IDXA[code & 7];
    if (idx < 0) idx = 0; else if (idx > 88) idx = 88;
    if (n & 1) out[n >> 1] |= code << 4; else out[n >> 1] = code;
  }
  return out;
}
const CRCT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRCT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function pack7(b) {
  const o = [];
  for (let i = 0; i < b.length; i += 7) {
    const g = b.subarray ? b.subarray(i, i + 7) : b.slice(i, i + 7);
    let m = 0; for (let j = 0; j < g.length; j++) m |= ((g[j] >> 7) & 1) << j;
    o.push(m); for (let j = 0; j < g.length; j++) o.push(g[j] & 0x7F);
  }
  return o;
}
/* zones: [{s: Int16Array at 22050 Hz, note}] ascending by note. One pad = one zone with lo = hi = root = note.
   Same bytes as tools/sampleio.py user_slot (see web/EDITOR_PROTOCOL.md, "User sample slot"). */
function buildSlot(name, zones) {
  if (zones.length < 1 || zones.length > MAXZ) throw new Error('1..16 chops per slot');
  const parts = zones.map(z => imaEncode(z.s));
  const len = parts.reduce((a, p) => a + p.length, 0);
  if (len > MAXB) throw new Error('too long: ' + len + ' B of ADPCM, a slot holds ' + MAXB + ' B');
  const data = new Uint8Array(len), hdr = new Uint8Array(480), dv = new DataView(hdr.buffer);
  dv.setUint32(0, 0x504D5346, true); dv.setUint16(4, 1, true); hdr[6] = zones.length;
  const nm = name.toUpperCase().replace(/[^\x20-\x7E]/g, '').slice(0, 8);
  for (let i = 0; i < nm.length; i++) hdr[8 + i] = nm.charCodeAt(i);
  dv.setUint32(16, len, true);
  let off = 0;
  zones.forEach((z, i) => {
    const b = 32 + i * 28;
    dv.setUint32(b, off, true); dv.setUint32(b + 4, z.s.length, true); dv.setUint32(b + 8, 0, true);
    dv.setUint32(b + 12, z.s.length - 1, true); dv.setUint32(b + 16, 32768, true);
    dv.setInt16(b + 20, z.note * 16, true); dv.setInt16(b + 22, 0, true);
    hdr[b + 24] = 0; hdr[b + 25] = z.note; hdr[b + 26] = z.note; hdr[b + 27] = 0;
    data.set(parts[i], off); off += parts[i].length;
  });
  dv.setUint32(20, crc32(data), true);
  return { hdr, data };
}
/*ENDCORE*/

const $ = id => document.getElementById(id);
const cv = $('wv');
let X = null, PK = 1, M = [], E = 0, V = { a: 0, b: 1 }, cursor = null, sel = null, drag = null, hist = [], actx = null, mi = null, outP = null, inP = null, waiter = null, linked = false;
const NN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName = n => NN[n % 12] + (Math.floor(n / 12) - 1);
const WHITE = [0,2,4,5,7,9,11,12,14,16,17,19,21,23,24,26];
const padNote = p => +$('base').value + ($('lay').value === 'white' ? WHITE[p] : p);

function msg(t, k) { const m = $('msg'); m.textContent = t; m.className = k || ''; }
function snap() { hist.push({ M: M.slice(), E }); if (hist.length > 50) hist.shift(); }

/* ---- chops ---- */
function chops() { return M.map((a, i) => ({ a, b: i + 1 < M.length ? M[i + 1] : E })).filter(c => c.b - c.a >= 32); }
function chopData(c) {
  const o = X.slice(c.a, c.b);
  if ($('fade').checked) { const f = Math.min(44, o.length >> 2); for (let i = 0; i < f; i++) o[o.length - 1 - i] *= i / f; }
  return o;
}
const usedBytes = () => chops().slice(0, MAXZ).reduce((a, c) => a + ((c.b - c.a + 1) >> 1), 0);

/* ---- loading ---- */
$('open').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    msg('Decoding ' + f.name + ' ...');
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await f.arrayBuffer());
    const oc = new OfflineAudioContext(1, Math.max(MIN, Math.ceil(buf.duration * RATE)), RATE);
    const src = oc.createBufferSource(); src.buffer = buf; src.connect(oc.destination); src.start();
    X = (await oc.startRendering()).getChannelData(0).slice();
    PK = Math.max(1e-9, X.reduce((m, v) => Math.max(m, Math.abs(v)), 0));
    M = [0]; E = X.length; V = { a: 0, b: X.length }; cursor = null; sel = null; hist = [];
    $('fname').textContent = f.name.length > 28 ? f.name.slice(0, 27) + '…' : f.name;
    $('name').value = f.name.replace(/\.[^.]*$/, '').replace(/[^\x20-\x7E]/g, '').toUpperCase().slice(0, 8) || 'CHOP';
    msg(buf.duration.toFixed(1) + ' s loaded. Add markers, or try Equal slices or Auto chop.', 'ok');
  } catch (err) { msg('Could not read that file: ' + err.message, 'err'); }
  draw(); ui();
};

/* ---- markers ---- */
function addMarker(s) {
  s = Math.round(s);
  if (s < 0 || s > E - MIN || M.some(m => Math.abs(m - s) < MIN)) return false;
  snap(); M.push(s); M.sort((p, q) => p - q); sel = M.indexOf(s); return true;
}
$('add').onclick = () => { if (cursor !== null && !addMarker(cursor)) msg('A marker is already that close, or the cursor is past the end.', 'err'); draw(); ui(); };
$('del').onclick = () => {
  if (typeof sel === 'number') { snap(); M.splice(sel, 1); if (!M.length) M = [0]; sel = null; draw(); ui(); }
};
$('undo').onclick = () => { const h = hist.pop(); if (h) { M = h.M; E = h.E; sel = null; draw(); ui(); } };
$('eq').onclick = () => {
  const n = +$('eqn').value; snap(); E = X.length;
  M = Array.from({ length: n }, (_, i) => Math.floor(i * E / n)); sel = null; draw(); ui();
};
function detect(sens) {
  const W = 256, H = 128, e = [];
  for (let i = 0; i + W <= X.length; i += H) { let s = 0; for (let j = 0; j < W; j++) s += X[i + j] * X[i + j]; e.push(Math.sqrt(s / W)); }
  const mx = Math.max(1e-9, ...e), out = []; let last = -1e9;
  for (let k = 1; k < e.length; k++) {
    let m = 0, c = 0; for (let q = Math.max(0, k - 8); q < k; q++) { m += e[q]; c++; } m /= c;
    if (e[k] > sens * m + 0.02 * mx && e[k] > 0.08 * mx && k * H - last > 0.06 * RATE) {
      const a0 = Math.max(0, (k - 1) * H), a1 = Math.min(X.length, k * H + W);
      let pk = 0; for (let i = a0; i < a1; i++) pk = Math.max(pk, Math.abs(X[i]));
      let p = a0; while (p < a1 - 1 && Math.abs(X[p]) < 0.2 * pk) p++;
      p = Math.max(0, p - 100);
      for (let q = p; q > Math.max(0, p - 100); q--) if ((X[q - 1] <= 0) !== (X[q] <= 0)) { p = q; break; }
      out.push({ p, st: e[k] / (m + 1e-6) }); last = k * H;
    }
  }
  return out;
}
$('auto').onclick = () => {
  let o = detect(+$('sens').value);
  if (!o.length) { msg('No transients found. Lower the sensitivity value or use Equal slices.', 'err'); return; }
  if (o.length > MAXZ) o = o.sort((p, q) => q.st - p.st).slice(0, MAXZ);
  snap(); E = X.length; M = o.map(v => v.p).sort((p, q) => p - q); sel = null;
  msg(M.length + ' chops found.', 'ok'); draw(); ui();
};

/* ---- view ---- */
function zoom(f) {
  const c = (V.a + V.b) / 2, w = Math.min(X.length, Math.max(512, (V.b - V.a) * f));
  V.a = Math.max(0, Math.min(X.length - w, c - w / 2)); V.b = V.a + w; draw(); ui();
}
$('zi').onclick = () => zoom(0.5); $('zo').onclick = () => zoom(2);
$('scroll').oninput = e => { const w = V.b - V.a; V.a = (X.length - w) * e.target.value / 1000; V.b = V.a + w; draw(); };
const xOf = s => (s - V.a) / (V.b - V.a) * cv.clientWidth;
const sOf = x => V.a + x / cv.clientWidth * (V.b - V.a);

function draw() {
  const g = cv.getContext('2d'), d = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
  g.font = '11px ' + getComputedStyle(document.body).getPropertyValue('--mono');
  const ink = '#1d2b21';
  if (!X) { g.fillStyle = ink; g.fillText('Load audio to start chopping', 8, h / 2); return; }
  const spp = (V.b - V.a) / w; g.fillStyle = ink;
  for (let px = 0; px < w; px++) {
    let lo = 1, hi = -1; const s0 = Math.floor(V.a + px * spp), s1 = Math.min(X.length, Math.floor(V.a + (px + 1) * spp) + 1);
    for (let i = s0; i < s1; i++) { const v = X[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (hi >= lo) g.fillRect(px, h / 2 - hi * h * 0.45, 1, Math.max(1, (hi - lo) * h * 0.45));
  }
  const ex = xOf(E);
  g.fillStyle = 'rgba(168,187,164,.7)'; if (ex < w) g.fillRect(Math.max(0, ex), 0, w - Math.max(0, ex), h);
  const used = chops();
  M.forEach((m, i) => {
    const x = xOf(m); if (x < -2 || x > w + 2) return;
    const n = used.findIndex(c => c.a === m), on = n >= 0 && n < MAXZ;
    g.strokeStyle = sel === i ? '#b3321a' : ink; g.lineWidth = sel === i ? 2 : 1; g.setLineDash(on ? [] : [3, 3]);
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
    g.fillStyle = sel === i ? '#b3321a' : ink; g.fillText(on ? String(n + 1) : '-', x + 3, 11);
  });
  g.setLineDash([2, 3]); g.strokeStyle = sel === 'end' ? '#b3321a' : ink; g.lineWidth = sel === 'end' ? 2 : 1;
  if (ex >= 0 && ex <= w) { g.beginPath(); g.moveTo(ex, 0); g.lineTo(ex, h); g.stroke(); g.fillStyle = ink; g.fillText('end', Math.max(0, ex - 22), h - 4); }
  if (cursor !== null) { g.setLineDash([1, 3]); g.strokeStyle = '#555'; g.lineWidth = 1; const cx = xOf(cursor); g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, h); g.stroke(); }
  g.setLineDash([]);
}
cv.onpointerdown = e => {
  if (!X) return;
  const x = e.offsetX; let best = null, bd = 14;
  M.forEach((m, i) => { const d = Math.abs(xOf(m) - x); if (d < bd) { bd = d; best = i; } });
  if (Math.abs(xOf(E) - x) < bd) best = 'end';
  if (best !== null) { drag = best; sel = best; snap(); cv.setPointerCapture(e.pointerId); }
  else { cursor = Math.max(0, Math.min(X.length - 1, sOf(x))); sel = null; }
  draw(); ui();
};
cv.onpointermove = e => {
  if (drag === null) return;
  const s = Math.round(Math.max(0, Math.min(X.length, sOf(e.offsetX))));
  if (drag === 'end') E = Math.max(M[M.length - 1] + MIN, s);
  else { const lo = drag ? M[drag - 1] + MIN : 0, hi = (drag < M.length - 1 ? M[drag + 1] : E) - MIN; M[drag] = Math.max(lo, Math.min(hi, s)); }
  draw(); ui();
};
cv.onpointerup = cv.onpointercancel = () => { drag = null; };
window.onresize = draw;

/* ---- pads ---- */
const padsEl = $('pads');
for (const r of [3, 2, 1, 0]) for (let c = 0; c < 4; c++) {         // pad 1 bottom-left, as on an MPC
  const p = r * 4 + c, b = document.createElement('button');
  b.type = 'button'; b.className = 'pad empty'; b.id = 'p' + p;
  b.innerHTML = '<b>' + (p + 1) + '</b><small></small>';
  b.onpointerdown = () => hit(p);
  b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(p); } };
  padsEl.appendChild(b);
}
function hit(p) {
  const c = chops()[p]; if (!c || p >= MAXZ) return;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
  const d = chopData(c), buf = actx.createBuffer(1, d.length, RATE); buf.copyToChannel(d, 0);
  const s = actx.createBufferSource(); s.buffer = buf; s.connect(actx.destination); s.start();
  const el = $('p' + p); el.classList.add('lit'); setTimeout(() => el.classList.remove('lit'), 140);
}

function ui() {
  const cs = chops(), has = !!X, bytes = usedBytes(), over = bytes > MAXB;
  for (let p = 0; p < MAXZ; p++) {
    const el = $('p' + p), c = cs[p];
    el.classList.toggle('empty', !c);
    el.querySelector('small').textContent = (c ? ((c.b - c.a) / RATE).toFixed(2) + ' s · ' : '') + noteName(padNote(p));
  }
  $('cap').textContent = (bytes * 2 / RATE).toFixed(1) + ' / ' + (MAXB * 2 / RATE).toFixed(1) + ' s';
  $('meter').className = 'meter' + (over ? ' over' : ''); $('meter').firstChild.style.width = Math.min(100, bytes / MAXB * 100) + '%';
  ['eq', 'auto', 'zi', 'zo'].forEach(i => $(i).disabled = !has);
  $('add').disabled = !has || cursor === null; $('del').disabled = typeof sel !== 'number'; $('undo').disabled = !hist.length;
  $('scroll').disabled = !has || (V.b - V.a) >= X.length;
  if (has && V.b - V.a < X.length) $('scroll').value = V.a / (X.length - (V.b - V.a)) * 1000;
  $('send').disabled = !(has && linked && cs.length && !over);
  if (has && over) msg('Too long by ' + ((bytes - MAXB) * 2 / RATE).toFixed(1) + ' s. Move the end marker earlier or remove chops.', 'err');
  else if (M.length > MAXZ) msg('Only the first 16 chops get pads.');
}
['base', 'lay', 'fade'].forEach(i => $(i).onchange = ui);

/* ---- MIDI ---- */
function req(cmd, args = [], ms = 3000) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => { waiter = null; rej(new Error('no reply to command ' + cmd)); }, ms);
    waiter = { cmd, res: d => { clearTimeout(t); res(d); } };
    outP.send([0xF0, 0x7D, 0x46, 0x4C, cmd, ...args, 0xF7]);
  });
}
function listen(e) {
  const d = e.data;
  if (waiter && d[0] === 0xF0 && d[1] === 0x7D && d[2] === 0x46 && d[3] === 0x4C && d[4] === waiter.cmd) {
    const w = waiter; waiter = null; w.res(Array.from(d.slice(5, d.length - 1)));
  }
}
function pick() {
  const o = [...mi.outputs.values()], sel = $('port');
  sel.innerHTML = o.map((p, i) => '<option value="' + i + '">' + p.name + '</option>').join('');
  const f = o.findIndex(p => /felucca/i.test(p.name)); if (f >= 0) sel.value = f;
  sel.hidden = o.length < 2 && f >= 0; return o;
}
async function link() {
  if (inP) inP.onmidimessage = null;
  const o = pick(); outP = o[+$('port').value];
  if (!outP) throw new Error('No MIDI output found. Plug the FM-1 in by USB (running Felucca).');
  const ins = [...mi.inputs.values()];
  inP = ins.find(p => p.name === outP.name) || ins.find(p => /felucca/i.test(p.name)) || ins[0];
  if (!inP) throw new Error('No MIDI input found for ' + outP.name);
  inP.onmidimessage = listen;
  for (let i = 0; i < 3; i++) { try { await req(1, [], 1200); return; } catch (e) { if (i === 2) throw e; } }
}
$('conn').onclick = async () => {
  try {
    if (!navigator.requestMIDIAccess) throw new Error('This browser has no Web MIDI. Use Chrome or Edge (Android or desktop).');
    mi = mi || await navigator.requestMIDIAccess({ sysex: true });
    await link(); linked = true; $('info').disabled = false;
    msg('Connected to ' + outP.name + '.', 'ok');
  } catch (e) { linked = false; msg(e.message, 'err'); }
  ui();
};
$('port').onchange = async () => { try { await link(); msg('Connected to ' + outP.name + '.', 'ok'); } catch (e) { linked = false; msg(e.message, 'err'); } ui(); };
$('info').onclick = async () => {
  try {
    const r = await req(15); let i = 2; const out = [];
    for (let k = 0; k < r[0]; k++) {
      const nz = r[i], j = r.indexOf(0, i + 1);
      out.push('USR' + (k + 1) + ': ' + (nz ? nz + ' zones, ' + String.fromCharCode(...r.slice(i + 1, j)) + ', ' + r[j + 1] + ' KiB' : 'empty')); i = j + 2;
    }
    msg(out.join('\n'), 'ok');
  } catch (e) { msg(e.message, 'err'); }
};
const RC = { 1: 'size', 2: 'header', 3: 'data CRC', 4: 'flash', 5: 'zones' };
$('send').onclick = async () => {
  const slot = +$('slot').value - 1;
  try {
    const zones = chops().slice(0, MAXZ).map((c, p) => ({ s: Int16Array.from(chopData(c), v => Math.trunc(v / PK * 30000)), note: padNote(p) }));
    const { hdr, data } = buildSlot($('name').value || 'CHOP', zones);
    if (!confirm('Replace USR' + (slot + 1) + ' on the FM-1 with ' + zones.length + ' chops (' + data.length + ' bytes)? The transport will stop during the upload.')) return;
    $('send').disabled = true;
    let r = await req(11, [slot], 6000); if (r[1]) throw new Error('Begin failed (' + r[1] + ')');
    for (let off = 0; off < data.length; off += 256) {
      const a = 512 + off;
      r = await req(12, [slot, a & 127, (a >> 7) & 127, (a >> 14) & 127, ...pack7(data.subarray(off, off + 256))]);
      if (r[4]) throw new Error('Write at 0x' + a.toString(16) + ' failed (' + r[4] + ')');
      msg('Uploading ' + Math.min(off + 256, data.length) + ' / ' + data.length + ' bytes');
    }
    r = await req(13, [slot, ...pack7(hdr)], 8000);
    if (r[1]) throw new Error('Finish failed: ' + (RC[r[1]] || r[1]));
    msg('USR' + (slot + 1) + ' is ready: ' + zones.length + ' pads from ' + noteName(padNote(0)) + '. On a SAMPLE track, choose USR' + (slot + 1) + ' as its SET.', 'ok');
  } catch (e) { msg(e.message + '\nIf the slot looks empty, run Upload again.', 'err'); }
  ui();
};
draw(); ui();

/* ---- PWA: offline cache and install button ---- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
$('install').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('install').hidden = true; };
window.addEventListener('appinstalled', () => { $('install').hidden = true; });
</script>
